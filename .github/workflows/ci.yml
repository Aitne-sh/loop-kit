name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# loop-kit is shell + prompt files — no build. CI proves the harness stays portable
# across the BSD/GNU/Windows userland split (see README "Platform support").

env:
  # tests/run_tests.sh auto-picks `cores - 1, capped at 4` because it normally
  # runs on a workstation that is ALSO hosting agent sessions. A hosted runner is
  # dedicated, and the parallel lane is exec-latency bound rather than CPU bound,
  # so it pays to oversubscribe: macos-latest has 3 cores (auto -> -j2) and could
  # not finish inside 40 minutes at that width. Set the width explicitly here so
  # every job is measured at the same concurrency. The driver scales its hang
  # backstops with -j, so a wider lane cannot turn contention into a timeout FAIL.
  SUITE_JOBS: "4"

jobs:
  # BSD (macOS) + GNU (Linux) full behavioral suite — the primary regression net.
  # macOS is the leg that catches BSD-only bugs (e.g. GNU-only sed \b); Linux the
  # GNU leg. ~1000+ assertions, fake agent (zero tokens), ends with a shellcheck gate.
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite is exec-latency bound, not CPU bound, so it runs its parallel lane
    # concurrently (tests/run_tests.sh -j, width pinned by SUITE_JOBS above).
    # This is a WATCHDOG, not a performance budget: keep it well above the
    # expected wall time, because a timeout here reports as a mystery cancellation
    # with no assertion output, which is strictly worse than a slow suite. The
    # actual wall time is recorded in the step summary on every run — that, not
    # this number, is the perf signal. macOS at the previous 40 was tight enough
    # that ordinary runner variance cancelled the job mid-lane.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    env:
      # The gate SKIPS itself when shellcheck is absent, which is right for a dev
      # machine and wrong here: a runner image that drops shellcheck would silently
      # turn the lint gate into a no-op and nothing would say so.
      #
      # Linux only, and not for tidiness. Turning this on proved that macos-latest
      # ships NO shellcheck — that leg has never linted anything, and its gate has
      # been a silent no-op for as long as it has existed. The fix is not to brew
      # install one: shellcheck's analysis is OS-independent, both Linux legs
      # already run it against the pinned .shellcheckrc, and a third image would
      # add a third version to skew against, on the slowest runner. So macOS
      # deliberately does not lint, and now says so instead of pretending.
      LOOP_TEST_REQUIRE_SHELLCHECK: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "loop ci"
          git config --global init.defaultBranch main
      # The suite is zero-token: every agent invocation is redirected to the fake
      # via LOOP_CLAUDE_CMD. But a handful of guard-refusal tests invoke `./loop.sh`
      # bare (no override) and expect an EARLY guard (contract-swap, liveness) to
      # fire; loop.sh's `command -v claude` preflight sits ahead of some of those,
      # so on a runner with no `claude` the refusal reports "claude CLI not found"
      # instead of the guard's reason. A dev machine always has `claude` on PATH;
      # mirror that here with a fake so the preflight passes. It is never actually
      # executed on those paths (the guard refuses first) — it only has to exist.
      - name: Provide a fake claude on PATH (mirror a dev machine; preflight only)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/claude" <<SHIM
          #!/usr/bin/env bash
          exec "$GITHUB_WORKSPACE/tests/fake_claude.sh" "\$@"
          SHIM
          chmod +x "$HOME/.local/bin/claude"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          bash --version | head -1
          sed --version 2>/dev/null | head -1 || echo "BSD sed (no --version)"
          # `shellcheck --version | awk ...` exits 0 even when shellcheck is absent
          # (awk succeeds on empty input), so the `|| echo` fallback was unreachable
          # and a runner with no shellcheck printed NOTHING here. Probe first.
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version | awk '/version:/{print "shellcheck " $2}'
          else
            echo "no shellcheck on this runner (lint is enforced on the Linux legs)"
          fi
          command -v claude >/dev/null && echo "claude shim on PATH" || echo "no claude on PATH"
      - name: Run full suite (includes shellcheck gate)
        env:
          LOOP_TEST_TIMING: "1"
        run: |
          log="$RUNNER_TEMP/loop-suite.log"
          set +e
          ./tests/run_tests.sh -j"$SUITE_JOBS" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          # Wall time + the slowest sections, on every run: suite duration is a
          # thing that regresses silently, and this is the only place it is recorded.
          # The shellcheck version rides along because the lint gate's strictness
          # is a property of the RUNNER IMAGE, not of this repo — when the image
          # bumps it, this line is the evidence.
          {
            echo "## suite (${{ matrix.os }})"
            echo '```text'
            shellcheck --version 2>/dev/null | awk '/version:/{print "shellcheck " $2}' || true
            grep -E '^(passed:|wall:)' "$log" || true
            sed -n '/^slowest sections:/,/^$/p' "$log" | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            {
              echo '### Full suite failure (last 160 lines)'
              echo '```text'
              tail -n 160 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # Same suite with shasum removed so loop.sh's sha256() must take the coreutils
  # sha256sum fallback. Catches any hardcoded `shasum` that would break on a
  # coreutils-only / no-perl Linux (the class of bug CI previously couldn't see).
  suite-coreutils-only:
    name: suite (linux, coreutils sha256sum only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOOP_TEST_REQUIRE_SHELLCHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "loop ci"
          git config --global init.defaultBranch main
      - name: Force the coreutils sha256sum path (hide shasum)
        run: |
          for p in $(type -ap shasum 2>/dev/null || true); do sudo rm -f "$p"; done
          if command -v shasum >/dev/null 2>&1; then echo "shasum still on PATH — mask failed"; exit 1; fi
          command -v sha256sum >/dev/null 2>&1 || { echo "no sha256sum available"; exit 1; }
          echo "OK: shasum hidden, sha256sum present at $(command -v sha256sum)"
      - name: Provide a fake claude on PATH (mirror a dev machine; preflight only)
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/claude" <<SHIM
          #!/usr/bin/env bash
          exec "$GITHUB_WORKSPACE/tests/fake_claude.sh" "\$@"
          SHIM
          chmod +x "$HOME/.local/bin/claude"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          bash --version | head -1
          shellcheck --version 2>/dev/null | awk '/version:/{print "shellcheck " $2}' || echo "no shellcheck on runner"
      - name: Run full suite
        run: |
          log="$RUNNER_TEMP/loop-suite.log"
          set +e
          ./tests/run_tests.sh -j"$SUITE_JOBS" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo '## Coreutils-only suite failure (last 160 lines)'
              echo '```text'
              tail -n 160 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # Native Windows via Git Bash. ENFORCED: the checkout dimension Windows most needs
  # — LF (not CRLF) shebangs, and bash syntax under MSYS. Deployment + the static
  # assertions run INFORMATIONAL: the fleet/timing legs are expected-flaky on MSYS,
  # and the parallel fleet is WSL/Linux-only on Windows by design (see README).
  #
  # No shellcheck step here on purpose. windows-latest ships no shellcheck, so the
  # step it used to run silently skipped on every build — a lint gate that lints
  # nothing. ShellCheck's analysis is OS-independent and is already gated on both
  # Linux legs against the repo's pinned .shellcheckrc; adding a third runner image
  # would only re-introduce the version skew that .shellcheckrc exists to close.
  windows-lint:
    name: windows (Git Bash checkout + syntax)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Prove LF checkout (shebangs are not CRLF)
        run: |
          fail=0
          for f in bin/loop.sh bin/evaluate.sh tests/run_tests.sh tests/lib.sh \
                   tests/fake_claude.sh tests/suite/*.sh; do
            if head -1 "$f" | od -An -c | grep -qF '\r'; then
              echo "CRLF in first line of $f — .gitattributes eol=lf not applied"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "OK: shebangs are LF"
          exit "$fail"
      - name: Syntax check
        run: |
          bash -n bin/loop.sh bin/evaluate.sh tests/run_tests.sh tests/lib.sh \
                 tests/fake_claude.sh tests/suite/*.sh
      # SCOPED on purpose. This used to run the FULL suite, capped at 15 minutes.
      # It never once finished: MSYS exec latency is high enough that a single
      # behavioural file can take 12 minutes, so every build — green ones included —
      # ended in "the action has timed out", producing an error annotation and no
      # result. A step that always times out proves nothing and costs 15 minutes.
      #
      # What runs now is bounded and always completes. The MSYS-relevant claim is
      # the deployment path — `bin/loop.sh init` must work from Git Bash — and the
      # driver performs exactly that to build its golden fixture before any suite
      # file runs, so selecting the one file that is known to finish in under a
      # second on MSYS (05-static, pure file-content assertions) buys the init
      # round-trip for ~no wall clock. The fleet is a documented non-goal on MSYS
      # and is deliberately not attempted. Widen this subset once real MSYS
      # per-file timings exist — today the only measured ones are 12+ minutes.
      #
      # Still continue-on-error while this proves itself over a few builds; promote
      # it to enforced once it has been green. The step cap stays BELOW the job
      # timeout because a job-level timeout is NOT covered by continue-on-error
      # (a step-level one is). Fake claude mirrors a dev machine so bare
      # guard-refusal invocations don't misreport "claude CLI not found".
      - name: Deploy + static assertions (informational — MSYS is best-effort)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "loop ci"
          git config --global init.defaultBranch main
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/claude" <<SHIM
          #!/usr/bin/env bash
          exec "$GITHUB_WORKSPACE/tests/fake_claude.sh" "\$@"
          SHIM
          chmod +x "$HOME/.local/bin/claude"
          export PATH="$HOME/.local/bin:$PATH"
          log="$RUNNER_TEMP/loop-msys.log"
          set +e
          ./tests/run_tests.sh --only 05-static 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo '## windows (MSYS, informational)'
            echo '```text'
            grep -E '^(passed:|wall:)' "$log" || true
            [ "$status" -eq 0 ] || tail -n 40 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
